<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoir va yozuvchi</title>
<meta name="description" content="Shoir va yozuvchining shaxsiy sayti: she’rlar, kitoblar va yangiliklar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8a15a'/%3E%3Cpath d='M9 22c6 0 10-4 14-12-3 1-6 1-9 4l3-6c-5 2-8 7-8 14z' fill='%23141210'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav" id="nav">
  <a class="brand" href="#top" id="brand"></a>
  <nav>
    <a href="#about">Haqida</a>
    <a href="#poems" data-sec="poems">She’rlar</a>
    <a href="#books" data-sec="books">Kitoblar</a>
    <a href="#media" data-sec="media">Media</a>
    <a href="#news" data-sec="news">Yangiliklar</a>
    <a href="#contact">Aloqa</a>
  </nav>
  <button class="theme" id="theme" aria-label="Mavzuni almashtirish">◐</button>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-text reveal">
      <p class="eyebrow" id="role"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
      <div class="cta">
        <a class="btn primary" href="#poems">She’rlarni o‘qish</a>
        <a class="btn" href="#media" id="mediaBtn" hidden>▶ Media</a>
        <a class="btn" href="#contact">Bog‘lanish</a>
      </div>
    </div>
    <div class="portrait reveal" id="portrait"><div class="ph" id="initials"></div></div>
  </section>

  <section id="about" class="wrap about">
    <h2 id="aboutTitle"></h2>
    <div class="about-body" id="aboutBody"></div>
    <blockquote id="quote"></blockquote>
  </section>

  <section id="poems" class="wrap" hidden>
    <h2>She’rlar</h2>
    <div class="grid poems" id="poemList"></div>
  </section>

  <section id="books" class="wrap" hidden>
    <h2>Kitoblar</h2>
    <div class="grid books" id="bookList"></div>
  </section>

  <section id="media" class="wrap" hidden>
    <h2>Media</h2>
    <div class="tabs" role="tablist" id="mediaTabs"></div>
    <div id="mediaPanel" role="tabpanel"></div>
  </section>

  <section id="news" class="wrap" hidden>
    <h2>Yangiliklar</h2>
    <div class="grid news" id="newsList"></div>
  </section>

  <section id="contact" class="wrap contact">
    <h2>Aloqa</h2>
    <div class="links" id="links"></div>
  </section>
</main>

<footer class="footer">
  <span id="copy"></span>
  <a href="/admin" class="admin-link">Admin</a>
</footer>

<dialog id="modal"><button class="close" id="close" aria-label="Yopish">×</button><div id="modalBody"></div></dialog>
<script src="/app.js"></script>
</body>
</html>
